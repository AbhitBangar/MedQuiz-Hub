<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samhita Adhyayan - Ashvin Rural Ayurvedic College</title>
    <link rel="stylesheet" href="../../level2/level2.css">
    <link rel="icon" type="image/jpg" href="../../assets/collegelogo.jpg">
    <script src="../../auth.js"></script>
</head>
<header>
    <h1>📝 Samhita Adhyayan</h1>
</header>
<body>
    <button onclick="window.location.href='../../level3/level3.html'" style="position: absolute; top: 10px; left: 10px; background: linear-gradient(145deg, #6600CC, #7700EE); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000; transition: all 0.3s ease;" onmouseover="this.style.background='linear-gradient(145deg, #7700EE, #8800FF)'" onmouseout="this.style.background='linear-gradient(145deg, #6600CC, #7700EE)'">← Back</button>
    <button onclick="logout()" style="position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000;">Logout</button>
  <div class="quiz-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="question-container">
        <div class="question-header">
          <span class="question-number">Question 1 of 0</span>
        </div>
        <div class="question-text">
          Loading questions...
        </div>
        <div class="options-container">
          <!-- Options will be loaded dynamically -->
        </div>
        <div class="result-container">
          <div class="result-message"></div>
          <div class="navigation-buttons">
            <button class="prev-btn" style="display: none;">Previous Question</button>
            <button class="next-btn" style="display: none;">Next Question</button>
          </div>
        </div>
      </div>
  </div>
    <script src="samhita.js"></script>
</body>
</html>
