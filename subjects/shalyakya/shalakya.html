<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shalakya Tantra Quiz - Ashvin Rural Ayurvedic College</title>
    <link rel="stylesheet" href="../../level2/level2.css">
    <link rel="icon" type="image/jpg" href="../../assets/collegelogo.jpg">
</head>
<header>
    <h1>📝 Shalakya Tantra Quiz</h1>
</header>
<body>
  <div class="quiz-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="question-container">
        <div class="question-header">
          <span class="question-number">Question 1 of 0</span>
        </div>
        <div class="question-text">
          Loading questions...
        </div>
        <div class="options-container">
          <!-- Options will be loaded dynamically -->
        </div>
        <div class="result-container">
          <div class="result-message"></div>
          <div class="navigation-buttons">
            <button class="prev-btn" style="display: none;">Previous Question</button>
            <button class="next-btn" style="display: none;">Next Question</button>
          </div>
        </div>
      </div>
  </div>
    <script src="shalakya.js"></script>
</body>
</html>
