<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Home - Ashvin Rural Ayurvedic College</title>
    <link rel="stylesheet" href="./home.css" />
    <link rel="icon" type="image/jpg" href="./assets/collegelogo.jpg">
    <script src="./auth.js"></script>
</head>
<body>
    <div class="container">
        <div id="home">
            <!-- Left Side - Logo -->
            <div class="logo-section">
                <img src="./assets/collegelogo.jpg" alt="Ashvin College Logo">
            </div>
            
            <!-- Right Side - Content -->
            <div class="content-section">
                <h1>Ashvin Rural Ayurvedic College<br>Manachi Hill, Sangamner</h1>
                <h3>Dr. Vikram Shelavale</h3>
                <h3>Associate Professor (B.A.M.S, M.D)</h3>
                <h3>Department: Kaumarbhritya</h3>
                
                <!-- Button Container -->
                <div class="button-container">
                    <a class="btn" href="./select.html">Start</a>
                    <a class="btn btn-admin admin-only" href="./edit-questions.html">Edit Questions</a>
                    <button class="btn" onclick="logout()" style="background: #dc3545; color: white; border: none; cursor: pointer;">Logout</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Check if user is admin and show admin button
        document.addEventListener('DOMContentLoaded', function() {
            // Get user info from localStorage (set during login)
            const currentUser = localStorage.getItem('currentUser');
            const userRole = localStorage.getItem('userRole');
            
            // Show admin button if user is admin (regardless of login tab used)
            if (currentUser === 'Vikram Shelavale' || userRole === 'admin') {
                const adminButtons = document.querySelectorAll('.admin-only');
                adminButtons.forEach(button => {
                    button.style.display = 'inline-block';
                });
            }
        });
    </script>
</body>
</html>
