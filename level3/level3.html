<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizExam</title>
    <!-- Google Font -->
    <link rel="icon" type="image/jpg" href="../assets/collegelogo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="./level3.css"/>
    <!-- Stylesheet -->
    <script src="../auth.js"></script>
</head>
<header>
    <h1>🛞 Spin the Subject</h1>
</header>
<body>
    <button onclick="window.location.href='../select.html'" style="position: absolute; top: 10px; left: 10px; background: linear-gradient(145deg, #6600CC, #7700EE); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000; transition: all 0.3s ease;" onmouseover="this.style.background='linear-gradient(145deg, #7700EE, #8800FF)'" onmouseout="this.style.background='linear-gradient(145deg, #6600CC, #7700EE)'">← Back</button>
    <button onclick="logout()" style="position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000;">Logout</button>
  <div>
      <div class="container">
        <canvas id="wheel"></canvas>
        <button id="spin-btn">Spin</button>
        <img src="../assets/spin arrow.jpg" alt="spinner arrow"/>
        <div id="final-value">
          <p>Let's Spin the Wheel</p>
        </div>
      </div>
      <!-- Subject Button - Outside Container -->
      <a id="selected-segment-btn" href="#" style="display: none;">
            <!-- Selected subject will appear here -->
        </a>
    </div>
    <!-- Chart JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Chart JS Plugin for displaying text over chart -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>

    <script src="level3.js"></script>

</body>
</html>
