<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery - Ashvin Rural Ayurvedic College</title>
    <link rel="icon" type="image/jpg" href="../assets/collegelogo.jpg">
    <link rel="stylesheet" href="level4.css">
    <script src="level4.js" defer></script>
    <script src="../auth.js"></script>
</head>
<body>
    <button onclick="window.location.href='../select.html'" style="position: absolute; top: 10px; left: 10px; background: linear-gradient(145deg, #6600CC, #7700EE); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000; transition: all 0.3s ease;" onmouseover="this.style.background='linear-gradient(145deg, #7700EE, #8800FF)'" onmouseout="this.style.background='linear-gradient(145deg, #6600CC, #7700EE)'">← Back</button>
    <button onclick="logout()" style="position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000;">Logout</button>
    <header>
        <h1>🖼️ Interactive Image Gallery</h1>
    </header>

    <!-- Wrap all content except popup in a container (main) -->
    <main id="mainContent">
        <div class="quiz-container">
            <div class="image-container">
                <img id="quizImage" src="../assets/level4/1.jpeg" alt="Medical Image" class="quiz-image">
                <!-- <p class="image-info">Click image for details</p> -->
            </div>
            
            <div class="question-container" style="display: none;">
                <h2 id="questionText">What condition is shown in this image?</h2>
                <div class="options-container" id="optionsContainer">
                    <!-- Options will be dynamically loaded -->
                </div>
            </div>
            
            <div class="navigation-container">
                <button id="backBtn" class="nav-btn" disabled>← Back</button>
                <span id="progressText" class="progress-text">1 / 13</span>
                <button id="nextBtn" class="nav-btn">Next →</button>
            </div>
            
            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-content">
                    <h2>Gallery Complete!</h2>
                    <p id="finalScore"></p>
                    <div class="action-buttons">
                        <button id="restartBtn" class="restart-btn">Restart Gallery</button>
                        <button id="homeBtn" class="home-btn">Home</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Popup Window -->
    <div id="popup" class="popup-window">
        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <p id="popupText">This is where the explanation will appear.</p>
        </div>
    </div>
</body>
</html>
